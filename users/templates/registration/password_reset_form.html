{% extends 'movies/base.html' %}

{% block title %}– Passwort zurücksetzen{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Passwort <em style="color:var(--gold); font-style:italic;">zurücksetzen</em></h2>
        <p>Gib deine E-Mail-Adresse ein – wir senden dir einen Reset-Link.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>E-Mail Adresse</label>
                <input type="email" name="email" placeholder="deine@email.com" autofocus required>
            </div>
            <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center; margin-top:0.5rem;">
                Reset-Link senden
            </button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'login' %}">← Zurück zum Login</a>
        </div>
    </div>
</div>
{% endblock %}
