{% extends 'movies/base.html' %}

{% block title %}– E-Mail gesendet{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align:center;">
        <div style="font-size:3rem; margin-bottom:1rem;">📧</div>
        <h2>E-Mail <em style="color:var(--gold); font-style:italic;">gesendet</em></h2>
        <p>Wir haben dir einen Reset-Link geschickt – überprüfe deinen Posteingang.</p>
        <a href="{% url 'login' %}" class="btn btn-ghost" style="width:100%; justify-content:center; margin-top:1.5rem;">
            Zurück zum Login
        </a>
    </div>
</div>
{% endblock %}
